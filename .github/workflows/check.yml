name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Składnia skryptów
        run: for f in tools/*.mjs; do node --check "$f"; done
      - name: Kolejka, LinkedIn i wideo
        run: node tools/check.mjs
